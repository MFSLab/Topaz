    <!-- Sidebar (Liquid Glass) -->
<aside class="w-64 glass-sidebar text-textPrimary p-4 flex flex-col items-center sidebar m-4" aria-label="Navegación principal">

        <img th:src="@{/images/topaz-logo-text.svg}" alt="Logo" class="w-[120px] select-none">
    </div>

    <!-- Navigation -->
    <nav class="space-y-2 w-full flex flex-col items-center">
            <a href="/dashboard/load" class="w-full flex items-center gap-2 text-left py-2 px-4 button-sidebar select-none">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-home"/></svg> Inicio
            </a>
            <a href="/journal/load" class="w-full flex items-center gap-2 text-left py-2 px-4 button-sidebar select-none">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-book-open"/></svg> Diario
            </a>
            <a href="/revision/load" class="w-full flex items-center gap-2 text-left py-2 px-4 button-sidebar select-none">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-refresh-cw"/></svg> Revisión
            </a>
            <a href="/innerwork/load" class="w-full flex items-center gap-2 text-left py-2 px-4 button-sidebar select-none">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-brain"/></svg> Trabajo Interno
            </a>
            <a href="/stats/load" class="w-full flex items-center gap-2 text-left py-2 px-4 button-sidebar select-none">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-bar-chart-2"/></svg> Estadísticas
            </a>
            <a href="/meditacion/load" class="w-full flex items-center gap-2 text-left py-2 px-4 button-accent select-none" aria-current="page">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-moon"/></svg> Meditación
            </a>
            <a href="/about" class="w-full flex items-center gap-2 text-left py-2 px-4 button-sidebar select-none">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-info"/></svg> Sobre Topaz

</aside>


<!-- Main content -->
    <div class="main-content flex-grow p-6 select-none">
        <main class="container mx-auto mt-6 p-4">
            <h1 class="text-3xl font-bold mb-4 text-textPrimary">Meditación</h1>

            <div class="glass-card p-6">
                <p class="text-lg font-bold mb-4 text-accent text-left">Temporizador de Meditación</p>

                <!-- Time input -->
                <div class="flex flex-col items-center justify-center gap-2 mb-4">
                    <span class="text-textPrimary">Introduce el tiempo:</span>

                    <div class="flex items-center gap-2">
                        <input id="timeInput" type="number" min="1" max="120" value="15"
                            class="glass-input w-16 text-textPrimary text-center px-2 py-1" />
                        <span class="text-textPrimary">minutos</span>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="flex gap-2 justify-center mb-6">
                    <button id="customStartBtn"
                        class="button-accent text-textPrimary px-4 py-2 rounded-lg transition-all duration-300">
                        Iniciar
                    </button>
                    <button id="customRestartBtn"
                        class="button-accent text-textPrimary px-4 py-2 rounded-lg transition-all duration-300">
                        Reiniciar
                    </button>
                </div>

                <!-- Progress bar -->
                <div class="glass-progress mb-4">
                    <div id="customProgress" class="h-full bg-accent transition-all duration-1000" style="width: 0%;">
                    </div>
                </div>

                <!-- Timer display -->
                <p id="customTimer" class="text-center text-textPrimary text-2xl mb-4">15:00</p>
            </div>

            <div class="glass-card p-6 mt-4" x-data="{ open: false }">
                <!-- Mindfulness Instructions -->
                <div class="text-textPrimary text-base space-y-2">
                    <p class="text-lg font-bold mb-4 text-accent text-left">Cómo Practicar la Atención Plena</p>

                    <!-- Show/Hide Button 
                    <button @click="open = !open"
                        class="px-4 py-2 rounded-md button-accent text-textPrimary text-sm transition">
                        <span x-text="open ? 'Ocultar' : 'Mostrar'"></span>
                    </button>
-->
                    <div x-data="{ step: 1, max: 6 }" class="w-full max-w-3xl mx-auto text-lg text-textSecondary">

                        <!-- Slides -->
                        <template x-for="i in max" :key="i">
                            <p x-show="step === i" class="transition-all duration-500 ease-in-out w-full">
                                <span x-text="{
                1: '1 - Encuentra un lugar tranquilo: Siéntate cómodo, con la espalda recta y las manos relajadas.',
                2: '2 - Cierra los ojos y respira: Inhala profundamente por la nariz y exhala lentamente por la boca.',
                3: '3 - Observa tu mente: No intentes vaciarla; simplemente nota los pensamientos sin juzgarlos.',
                4: '4 - Usa un ancla: Enfócate en tu respiración, los sonidos o las sensaciones de tu cuerpo.',
                5: '5 - Sé amable contigo mismo: Si te distraes, regresa a tu respiración con suavidad.',
                6: '6 - Finaliza con gratitud: Antes de abrir los ojos, agradece este momento de calma.'
            }[i]"></span>
                            </p>
                        </template>

                        <!-- Navigation Buttons -->
                        <div class="flex justify-center mt-4 gap-4">
                            <button @click="step = step > 1 ? step - 1 : max"
                                class="button-accent px-4 py-2 transition">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-arrow-big-left"/></svg>
                            </button>
                            <button @click="step = step < max ? step + 1 : 1"
                                class="button-accent px-4 py-2 transition">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-arrow-big-right"/></svg>
                            </button>
                        </div>

                    </div>
                </div>

                <!-- Audio Elements for New Sounds -->
                <audio id="startSound" src=""></audio>
                <audio id="endSound" src=""></audio>
            </div>

            <script>
                let customTimer;
                let customTimeLeft = 900; // Default: 15 minutes in seconds
                let customIsPaused = true;
                let customHasStarted = false;

                function playSound(audioId) {
                    const audio = document.getElementById(audioId);
                    if (audio) {
                        audio.play().catch(error => console.warn("Audio playback failed:", error));
                    }
                }

                function updateCustomTimerDisplay() {
                    let minutes = Math.floor(customTimeLeft / 60);
                    let seconds = customTimeLeft % 60;
                    document.getElementById("customTimer").innerText =
                        `${minutes}:${seconds.toString().padStart(2, "0")}`;

                    let totalSeconds = parseInt(document.getElementById("timeInput").value) * 60;
                    let progressPercent = ((totalSeconds - customTimeLeft) / totalSeconds) * 100;
                    document.getElementById("customProgress").style.width = `${progressPercent}%`;
                }

                function startCustomTimer() {
                    if (customHasStarted) {
                        customIsPaused = !customIsPaused; // Toggle pause
                        return;
                    }

                    let inputMinutes = parseInt(document.getElementById("timeInput").value);
                    if (isNaN(inputMinutes) || inputMinutes < 1) return;

                    customTimeLeft = inputMinutes * 60;
                    customIsPaused = false;
                    customHasStarted = true;
                    updateCustomTimerDisplay();

                    playSound("startSound"); // Play new start sound

                    customTimer = setInterval(() => {
                        if (!customIsPaused && customTimeLeft > 0) {
                            customTimeLeft--;
                            updateCustomTimerDisplay();
                        } else if (customTimeLeft === 0) {
                            clearInterval(customTimer);
                            playSound("endSound"); // Play new end sound
                            customHasStarted = false;
                        }
                    }, 1000);
                }

                function restartCustomTimer() {
                    clearInterval(customTimer);
                    customTimeLeft = parseInt(document.getElementById("timeInput").value) * 60;
                    updateCustomTimerDisplay();
                    document.getElementById("customProgress").style.width = "0%";
                    customHasStarted = false;
                }

                document.getElementById("customStartBtn").addEventListener("click", startCustomTimer);
                document.getElementById("customRestartBtn").addEventListener("click", restartCustomTimer);

                updateCustomTimerDisplay();
            </script>

        </main>
    </div>

    </div>
    <script th:src="@{/js/deleteFeature_openModal.js}" defer></script>
    <script th:src="@{/js/alpine.js}" defer></script>
