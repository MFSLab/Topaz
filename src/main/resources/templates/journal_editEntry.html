<!DOCTYPE html>
<html lang="es">

<head>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topaz</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">

    <script>
        window.onload = function () {
            const saveButton = document.getElementById('saveButton');
            const modal = document.getElementById('saveModal');
            const closeModal = document.getElementById('closeModal');
            const form = document.getElementById('journalForm');
        };
    </script>
</head>

<body class="font-sans leading-normal tracking-normal flex min-h-screen">
    <!-- Icon sprite: only the icons this page uses (replaces the 400 KB lucide.js) -->
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><symbol id="icon-arrow-big-left" viewBox="0 0 24 24"><path d="M10.793 19.793a.707.707 0 0 0 1.207-.5V16a1 1 0 0 1 1-1h6a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1h-6a1 1 0 0 1-1-1V4.707a.707.707 0 0 0-1.207-.5l-6.94 6.94a1.207 1.207 0 0 0 0 1.707z"/></symbol><symbol id="icon-bar-chart-2" viewBox="0 0 24 24"><path d="M5 21v-6"/><path d="M12 21V3"/><path d="M19 21V9"/></symbol><symbol id="icon-book-open" viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></symbol><symbol id="icon-brain" viewBox="0 0 24 24"><path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"/><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"/><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"/><path d="M18 18a4 4 0 0 0 2-7.464"/><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/><path d="M6 18a4 4 0 0 1-2-7.464"/><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"/></symbol><symbol id="icon-home" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol><symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol><symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></symbol><symbol id="icon-refresh-cw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol><symbol id="icon-save" viewBox="0 0 24 24"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></symbol></svg>

<!-- Sidebar (Liquid Glass) -->
<aside class="w-64 glass-sidebar text-textPrimary p-4 flex flex-col items-center sidebar m-4" aria-label="Navegación principal">

    <!-- Logo -->
    <div class="flex items-center mb-6 mt-2 flex-col">
        <img th:src="@{/images/topaz-logo-text.svg}" alt="Logo" class="w-[120px] select-none">
    </div>

    <!-- Navigation -->
    <nav class="space-y-2 w-full flex flex-col items-center">
            <a href="/dashboard/load" class="w-full flex items-center gap-2 text-left py-2 px-4 button-sidebar select-none">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-home"/></svg> Inicio
            </a>
            <a href="/journal/load" class="w-full flex items-center gap-2 text-left py-2 px-4 button-accent select-none" aria-current="page">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-book-open"/></svg> Diario
            </a>
            <a href="/revision/load" class="w-full flex items-center gap-2 text-left py-2 px-4 button-sidebar select-none">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-refresh-cw"/></svg> Revisión
            </a>
            <a href="/innerwork/load" class="w-full flex items-center gap-2 text-left py-2 px-4 button-sidebar select-none">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-brain"/></svg> Trabajo Interno
            </a>
            <a href="/stats/load" class="w-full flex items-center gap-2 text-left py-2 px-4 button-sidebar select-none">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-bar-chart-2"/></svg> Estadísticas
            </a>
            <a href="/meditacion/load" class="w-full flex items-center gap-2 text-left py-2 px-4 button-sidebar select-none">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-moon"/></svg> Meditación
            </a>
            <a href="/about" class="w-full flex items-center gap-2 text-left py-2 px-4 button-sidebar select-none">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-info"/></svg> Sobre Topaz
            </a>
    </nav>
</aside>


<!-- Main content -->
<div class="flex-grow p-6 main-content">
    <main class="container mx-auto mt-6 p-4">
        <h1 class="text-3xl font-bold mb-4 text-textPrimary">Diario</h1>

        <div class="glass-card p-6 flex flex-col justify-between">
            <div class="mb-4 relative flex justify-center items-center">
                <a href="/journal/load"
                   class="absolute left-0 text-textPrimary button-accent transition-colors duration-300 py-2 px-3 rounded-md select-none flex items-center justify-center">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-arrow-big-left"/></svg>
                </a>
                <h2 class="text-xl text-accent font-bold select-none">
                    Editar Entrada al Diario
                </h2>
            </div>


            <!-- Form to handle the journal entry -->
            <form id="journalForm" action="#" method="POST"
                  th:action="@{/journal/updateEntry/{id}(id=${journalEntry.id})}" th:object="${journalEntry}">

                <!-- hidden date -->
                <input type="text" name="date" id="date" class="hidden" th:value="${journalEntry.date}"/>

                <!-- Title -->
                <input type="text" name="title" id="title"
                       class="glass-input text-lg font-semibold mb-4 w-full text-textPrimary p-3"
                       placeholder="Título" th:value="${journalEntry.title}"/>

                <!-- General -->
                <label for="contentGeneral" class="block text-lg font-medium text-accent mb-2">General</label>
                <textarea name="contentGeneral" id="contentGeneral"
                          class="glass-input w-full h-[150px] resize-y p-3 text-textPrimary mb-4 text-base"
                          th:text="${journalEntry.contentGeneral}" placeholder="¿Qué has hecho hoy?"></textarea>

                <!-- Errores Cometidos -->
                <label for="contentErroresCometidos" class="block text-lg font-medium text-accent mb-2">Errores
                    Cometidos</label>
                <textarea name="contentErroresCometidos" id="contentErroresCometidos"
                          class="glass-input w-full h-[150px] resize-y p-3 text-textPrimary mb-6 text-base"
                          th:text="${journalEntry.contentErroresCometidos}"
                          placeholder="Hoy he hecho mal..."></textarea>

                <!-- Salud Física -->
                <label for="contentSaludFisica" class="block text-lg font-medium text-accent mb-2">Salud
                    Física</label>
                <textarea name="contentSaludFisica" id="contentSaludFisica"
                          class="glass-input w-full h-[150px] resize-y p-3 text-textPrimary mb-4 text-base"
                          th:text="${journalEntry.contentSaludFisica}"
                          placeholder="Hoy he ido al gimnasio..."></textarea>

                <!-- Salud Mental -->
                <label for="contentSaludMental" class="block text-lg font-medium text-accent mb-2">Salud
                    Mental</label>
                <textarea name="contentSaludMental" id="contentSaludMental"
                          class="glass-input w-full h-[150px] resize-y p-3 text-textPrimary mb-4 text-base"
                          th:text="${journalEntry.contentSaludMental}" placeholder="Hoy he meditado..."></textarea>

                <!-- Actividad Profesional -->
                <label for="contentCarreraProfesional" class="block text-lg font-medium text-accent mb-2">Actividad
                    Profesional</label>
                <textarea name="contentCarreraProfesional" id="contentCarreraProfesional"
                          class="glass-input w-full h-[150px] resize-y p-3 text-textPrimary mb-4 text-base"
                          th:text="${journalEntry.contentCarreraProfesional}"
                          placeholder="Hoy he trabajado en..."></textarea>

                <!-- Salud Financiera -->
                <label for="contentEstabilidadFinanciera"
                       class="block text-lg font-medium text-accent mb-2">Salud Financiera</label>
                <textarea name="contentEstabilidadFinanciera" id="contentEstabilidadFinanciera"
                          class="glass-input w-full h-[150px] resize-y p-3 text-textPrimary mb-4 text-base"
                          th:text="${journalEntry.contentEstabilidadFinanciera}"
                          placeholder="Hoy he ganado...Hoy he gastado..."></textarea>

                <!-- Crecimiento Personal -->
                <label for="contentCrecimientoPersonal"
                       class="block text-lg font-medium text-accent mb-2">Crecimiento Personal</label>
                <textarea name="contentCrecimientoPersonal" id="contentCrecimientoPersonal"
                          class="glass-input w-full h-[150px] resize-y p-3 text-textPrimary mb-4 text-base"
                          th:text="${journalEntry.contentCrecimientoPersonal}" placeholder="Hoy he leído..."></textarea>

                <!-- Relaciones Sociales -->
                <label for="contentRelacionesSociales" class="block text-lg font-medium text-accent mb-2">Relaciones
                    Sociales</label>
                <textarea name="contentRelacionesSociales" id="contentRelacionesSociales"
                          class="glass-input w-full h-[150px] resize-y p-3 text-textPrimary mb-4 text-base"
                          th:text="${journalEntry.contentRelacionesSociales}"
                          placeholder="Hoy he pasado tiempo con mi familia y amigos..."></textarea>

                <!-- Pasatiempos Creativos -->
                <label for="contentPasatiemposCreatividad"
                       class="block text-lg font-medium text-accent mb-2">Pasatiempos Creativos</label>
                <textarea name="contentPasatiemposCreatividad" id="contentPasatiemposCreatividad"
                          class="glass-input w-full h-[150px] resize-y p-3 text-textPrimary mb-4 text-base"
                          th:text="${journalEntry.contentPasatiemposCreatividad}"
                          placeholder="Hoy he hecho música...Hoy he dibujado..."></textarea>

                <!-- Recreación Ocio -->
                <label for="contentRecreacionDiversion"
                       class="block text-lg font-medium text-accent mb-2">Ocio</label>
                <textarea name="contentRecreacionDiversion" id="contentRecreacionDiversion"
                          class="glass-input w-full h-[150px] resize-y p-3 text-textPrimary mb-4 text-base"
                          th:text="${journalEntry.contentRecreacionDiversion}"
                          placeholder="Hoy he jugado a..."></textarea>


                <!-- Espiritualidad y Propósito -->
                <label for="contentEspiritualidadProposito"
                       class="block text-lg font-medium text-accent mb-2">Espiritualidad y Propósito</label>
                <textarea name="contentEspiritualidadProposito" id="contentEspiritualidadProposito"
                          class="glass-input w-full h-[150px] resize-y p-3 text-textPrimary mb-4 text-base"
                          th:text="${journalEntry.contentEspiritualidadProposito}"
                          placeholder="Hoy he reflexionado sobre..."></textarea>

                <!-- Contribución y Legado -->
                <label for="contentContribucionLegado"
                       class="block text-lg font-medium text-accent mb-2">Contribución y Legado</label>
                <textarea name="contentContribucionLegado" id="contentContribucionLegado"
                          class="glass-input w-full h-[150px] resize-y p-3 text-textPrimary mb-4 text-base"
                          th:text="${journalEntry.contentContribucionLegado}"
                          placeholder="Hoy he ayudado a...Hoy he enseñado a..."></textarea>

                <!-- Save Button -->
                <div class="mt-4 flex">
                    <button type="submit" id="saveButton"
                            class="ml-auto text-textPrimary button-accent transition-colors duration-300 py-2 px-3 rounded-md select-none flex items-center justify-center">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-save"/></svg>
                        &nbsp;&nbsp;Guardar
                    </button>
                </div>

            </form>

        </div>
    </main>
</div>

<script th:src="@{/js/deleteFeature_openModal.js}" defer></script>
<script th:src="@{/js/alpine.js}" defer></script>
</body>

</html>
