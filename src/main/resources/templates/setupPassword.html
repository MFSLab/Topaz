<!DOCTYPE html>
<html lang="es">

<head>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topaz</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>

<body class="font-sans leading-normal tracking-normal flex items-center justify-center min-h-screen">
    <div class="glass-card p-6 w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-textPrimary text-center">Bienvenido a Topaz</h1>
        <h2 class="text-l font-bold mb-6 text-accent text-center">Registrate</h2>

        <!-- Login Form -->
        <form th:action="@{/setupPassword}" method="post" class="flex flex-col gap-4">
            <div>
                <label class="text-accent font-bold text-sm mb-1 block" for="password">Contraseña</label>
                <input id="password" name="password" type="password" placeholder="Ingresa tu contraseña"
                    class="glass-input w-full p-3 text-textPrimary"
                    required>
            </div>
            <div>
                <label class="text-accent font-bold text-sm mb-1 block" for="confirm">Contraseña</label>
                <input id="confirm" name="confirm" type="password" placeholder="Repite tu contraseña"
                    class="glass-input w-full p-3 text-textPrimary"
                    required>
            </div>

            <button type="submit"
                class="mt-4 button-accent text-textPrimary font-bold py-3 rounded-xl transition-colors duration-300">
                Iniciar sesión
            </button>
        </form>

        <!-- Optional error message -->
        <div th:if="${param.error}" class="mt-4 text-alert text-center text-sm">
            Las contraseñas no coinciden.
        </div>
    </div>

    <script th:src="@{/js/deleteFeature_openModal.js}" defer></script>
    <script th:src="@{/js/alpine.js}" defer></script>
</body>

</html>
