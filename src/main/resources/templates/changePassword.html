<!DOCTYPE html>
<html lang="es">

<head>
   <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topaz</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">
</head>

<body class="font-sans leading-normal tracking-normal flex items-center justify-center min-h-screen">
    <div class="glass-card p-6 w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-accent">Cambiar contraseña</h1>

        <form th:action="@{/changePassword}" method="post" class="flex flex-col gap-4">
            <div>
                <label class="text-accent font-bold text-sm mb-1 block" for="current">Contraseña
                    actual</label>
                <input id="current" name="current" type="password" placeholder="Ingresa tu contraseña actual"
                    class="glass-input w-full p-3 text-textPrimary"
                    required>
            </div>

            <div>
                <label class="text-accent font-bold text-sm mb-1 block" for="newPassword">Nueva
                    contraseña</label>
                <input id="newPassword" name="newPassword" type="password" placeholder="Ingresa nueva contraseña"
                    class="glass-input w-full p-3 text-textPrimary"
                    required>
            </div>

            <div>
                <label class="text-accent font-bold text-sm mb-1 block" for="confirm">Confirma nueva
                    contraseña</label>
                <input id="confirm" name="confirm" type="password" placeholder="Confirma nueva contraseña"
                    class="glass-input w-full p-3 text-textPrimary"
                    required>
            </div>

            <button type="submit"
                class="mt-4 button-accent text-textPrimary font-bold py-3 rounded-xl transition-colors duration-300">
                Cambiar contraseña
            </button>
        </form>

        <!-- Change Password Link -->
        <div class="mt-4 text-center">
            <a th:href="@{/login}"
                class="text-sm text-accent hover:text-[#1C8FA1] transition-colors duration-300">
                Inicio
            </a>
        </div>

        <div th:if="${param.error}" class="mt-4 text-alert text-center text-sm">
            Contraseña actual incorrecta.
        </div>

        <div th:if="${param.mismatch}" class="mt-4 text-alert text-center text-sm">
            Las nuevas contraseñas no coinciden.
        </div>
    </div>


    <script th:src="@{/js/deleteFeature_openModal.js}" defer></script>
    <script th:src="@{/js/alpine.js}" defer></script>
</body>

</html>
