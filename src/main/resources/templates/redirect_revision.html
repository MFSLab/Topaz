<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topaz</title>
    <link th:href="@{/css/output.css}" rel="stylesheet">

    <script type="text/javascript">
        window.location.href = '/revision/load';
    </script>
</head>

<body class="font-sans leading-normal tracking-normal flex items-center justify-center min-h-screen">

    <!-- Liquid Glass loading card -->
    <main class="glass-card p-8 text-center w-full max-w-sm" role="status" aria-live="polite">
        <img th:src="@{/images/topaz-logo-text.svg}" alt="Logo" class="w-[120px] select-none mx-auto mb-6">
        <div class="glass-spinner"></div>
        <h1 class="text-xl text-textPrimary select-none">Cargando...</h1>
        <noscript><a class="text-accent" href="/revision/load">Continuar</a></noscript>
    </main>

</body>

</html>
